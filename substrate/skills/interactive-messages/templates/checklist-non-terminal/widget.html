<!-- Phase 139 checklist-non-terminal template — do not edit installed copies; edit the substrate template only -->
<!-- Sibling: checklist-terminal-on-submit — this variant removes the submit button and rewires each checkbox change → POST /update -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Phase 143: transparent body so the widget takes on the bubble color it
       lives in. Parent WidgetBubble handles overflow cue + scroll thumb. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      color: #111;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #e8e8e8; }
    }

    #prompt {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
    }

    #checklist {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .checklist-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      min-height: 44px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }

    .checklist-row:hover {
      background: #f0f0f0;
      border-color: #ccc;
    }

    .checklist-row:has(.opt-cb:checked) {
      background: #d0e8ff;
      border-color: #3b82f6;
    }

    .opt-cb {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: #3b82f6;
    }

    .opt-cb:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .opt-label {
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    @media (prefers-color-scheme: dark) {
      .checklist-row:hover { background: #2d2d2d; border-color: #555; }
      .checklist-row:has(.opt-cb:checked) { background: #1e3a5f; border-color: #3b82f6; }
      .opt-label { color: #e8e8e8; }
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }

    @media (prefers-color-scheme: dark) {
      #status { color: #aaa; }
    }
  </style>
</head>
<body>
  <h2 id="prompt"></h2>
  <!-- #checklist is populated by JS: one <label class="checklist-row"> per option,
       each wrapping an <input type="checkbox" class="opt-cb"> + <span class="opt-label"> -->
  <div id="checklist"></div>
  <div id="status"></div>

  <script>
    // Substitution points — the scaffold script replaces these inline literals.
    // __PROMPT_JSON__ is the JSON-encoded checklist question (HTML-safe via JSON string escaping).
    // __OPTIONS_JSON__ is a JSON array of option label strings.
    // __WIDGET_ID__ is the widget slug.
    // __PANE_BASE__ is the URL path prefix for the widget's own origin.
    var PROMPT    = __PROMPT_JSON__;
    var OPTIONS   = __OPTIONS_JSON__;
    var WIDGET_ID = "__WIDGET_ID__";
    var PANE_BASE = "__PANE_BASE__";

    document.addEventListener("DOMContentLoaded", function () {
      // Set the prompt text
      var promptEl = document.getElementById("prompt");
      promptEl.textContent = PROMPT;

      // Render one row per option into #checklist
      var checklistEl = document.getElementById("checklist");
      OPTIONS.forEach(function (label) {
        var row = document.createElement("label");
        row.className = "checklist-row";

        // Each row contains an <input type="checkbox" class="opt-cb"> for the option
        var cb = document.createElement("input");
        cb.setAttribute("type", "checkbox");
        cb.className = "opt-cb";
        cb.value = label;

        var span = document.createElement("span");
        span.className = "opt-label";
        span.textContent = label;

        row.appendChild(cb);
        row.appendChild(span);
        checklistEl.appendChild(row);

        // Persist checked state on every change (non-terminal: no submit, just live persistence)
        cb.addEventListener("change", function () {
          persistChecked();
        });
      });
    });

    function getCheckedLabels() {
      var cbs = document.querySelectorAll(".opt-cb");
      var checked = [];
      cbs.forEach(function (cb) {
        if (cb.checked) checked.push(cb.value);
      });
      return checked;
    }

    function setStatus(msg) {
      var el = document.getElementById("status");
      if (el) el.textContent = msg;
    }

    function persistChecked() {
      var checked = getCheckedLabels();
      setStatus("Saving…");

      var payload = {
        checked: checked,
        updated_at: new Date().toISOString()
      };

      // POST to /update (non-terminal: state persisted on every change, widget stays interactive)
      var updateUrl = PANE_BASE + "/update";

      fetch(updateUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok && res.status !== 204) {
          throw new Error("update returned " + res.status);
        }
        setStatus("Saved.");
        // Non-terminal: do NOT disable checkboxes. No parent frame signal needed.
        // The agent reads state.json alongside the user's next text reply.
      })
      .catch(function (err) {
        console.error("[widget] update fetch failed:", err);
        setStatus("Save failed — toggle again to retry.");
        // Non-terminal: do NOT disable checkboxes on failure — user can toggle again to retry.
      });
    }
  
    // Phase 143: report content height to parent so WidgetBubble can
    // auto-size the iframe up to its cap and paint the scroll thumb
    // when overflowing. Widget-side does zero overflow UI.
    var __lastReportedHeight = 0;
    function reportHeight() {
      var h = Math.ceil(document.documentElement.scrollHeight);
      // Dedup: skip if measured height matches last post. The parent-side
      // iframe `transition: height 120ms ease-out` was the primary
      // ignition for a renderer-pinning resize-storm (removed from
      // WidgetBubble.tsx 2026-10-02 after a confirmed main-thread freeze).
      // Widget-side dedup is defense in depth so no-op postMessages
      // don't flood even if a future consumer re-adds any transition
      // on the iframe.
      if (h === __lastReportedHeight) return;
      __lastReportedHeight = h;
      try {
        window.parent.postMessage(
          { type: "widget-resize", widgetId: WIDGET_ID, height: h },
          window.location.origin
        );
      } catch (e) { /* parent gone; harmless */ }
    }
    document.addEventListener("DOMContentLoaded", function () {
      reportHeight();
      if (typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(reportHeight);
        ro.observe(document.documentElement);
      }
    });
  </script>
</body>
</html>
