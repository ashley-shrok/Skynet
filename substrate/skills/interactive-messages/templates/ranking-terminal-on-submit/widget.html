<!-- Phase 138 ranking-terminal-on-submit template — do not edit installed copies; edit the substrate template only -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* Phase 143: transparent body so the widget takes on the bubble color it
       lives in. Parent WidgetBubble handles overflow cue + scroll thumb. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      color: #111;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #e8e8e8; }
    }

    #prompt {
      margin: 0 0 12px 0;
      font-size: 15px;
      font-weight: 600;
    }

    #rank-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rank-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      min-height: 44px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f9f9f9;
      cursor: grab;
    }

    .rank-row.dragging {
      opacity: 0.5;
    }

    .rank-row.drop-target {
      border-color: #3b82f6;
    }

    .drag-handle {
      flex-shrink: 0;
      color: #888;
      font-size: 18px;
      cursor: grab;
      user-select: none;
    }

    .rank-label {
      flex: 1;
    }

    .up-btn, .down-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-family: inherit;
    }

    .up-btn:hover:not(:disabled), .down-btn:hover:not(:disabled) {
      background: #e8e8e8;
      border-color: #888;
    }

    .up-btn:disabled, .down-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .submit-btn {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      padding: 10px 14px;
      font-size: 15px;
      font-family: inherit;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      background: #3b82f6;
      color: #fff;
      transition: background 0.1s, border-color 0.1s;
    }

    .submit-btn:hover:not(:disabled) {
      background: #2563eb;
      border-color: #2563eb;
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      min-height: 18px;
    }

    @media (prefers-color-scheme: dark) {
      .rank-row { background: #2d2d2d; border-color: #444; }
      .rank-row.drop-target { border-color: #3b82f6; }
      .drag-handle { color: #888; }
      .up-btn, .down-btn { background: #2d2d2d; color: #e8e8e8; border-color: #444; }
      .up-btn:hover:not(:disabled), .down-btn:hover:not(:disabled) { background: #3d3d3d; border-color: #888; }
      .submit-btn { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      .submit-btn:hover:not(:disabled) { background: #2563eb; border-color: #2563eb; }
      #status { color: #aaa; }
    }
  </style>
</head>
<body>
  <h2 id="prompt"></h2>
  <ol id="rank-list"></ol>
  <button id="submit-btn" type="button" class="submit-btn"></button>
  <div id="status"></div>

  <script>
    // Substitution points — the scaffold script replaces these inline literals.
    // __PROMPT_JSON__ is the JSON-encoded ranking question (HTML-safe via JSON string escaping).
    // __ITEMS_JSON__ is a JSON array of item label strings in initial order.
    // __WIDGET_ID__ is the widget slug.
    // __PANE_BASE__ is the URL path prefix for the widget's own origin.
    // __SUBMIT_LABEL_JSON__ is the JSON-encoded submit button label.
    var PROMPT       = __PROMPT_JSON__;
    var ITEMS        = __ITEMS_JSON__;
    var WIDGET_ID    = "__WIDGET_ID__";
    var PANE_BASE    = "__PANE_BASE__";
    var SUBMIT_LABEL = __SUBMIT_LABEL_JSON__;

    // Track the currently-dragged row
    var dragSrcRow = null;

    document.addEventListener("DOMContentLoaded", function () {
      // Set the prompt text
      document.getElementById("prompt").textContent = PROMPT;

      // Set the submit button label
      document.getElementById("submit-btn").textContent = SUBMIT_LABEL;

      // Render one row per item in initial order
      var list = document.getElementById("rank-list");
      ITEMS.forEach(function (label) {
        list.appendChild(buildRow(label));
      });

      // Initial disabled-state refresh for edge buttons
      refreshArrowStates();

      // Submit button handler
      document.getElementById("submit-btn").addEventListener("click", handleSubmit);
    });

    function buildRow(label) {
      var li = document.createElement("li");
      li.className = "rank-row";
      li.setAttribute("draggable", "true"); // draggable="true" — HTML5 drag-and-drop attribute (desktop)

      // Drag handle (visual affordance; touch fallback is the arrow buttons)
      var handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.setAttribute("aria-hidden", "true");
      handle.textContent = "☰"; // ☰ hamburger glyph

      // Item label
      var rankLabel = document.createElement("span");
      rankLabel.className = "rank-label";
      rankLabel.textContent = label;

      // Up arrow button — mobile / touch fallback for drag-and-drop
      var upBtn = document.createElement("button");
      upBtn.type = "button";
      upBtn.className = "up-btn";
      upBtn.setAttribute("aria-label", "Move up");
      upBtn.textContent = "▲"; // ▲
      upBtn.addEventListener("click", function () {
        moveRow(li, -1);
      });

      // Down arrow button — mobile / touch fallback for drag-and-drop
      var downBtn = document.createElement("button");
      downBtn.type = "button";
      downBtn.className = "down-btn";
      downBtn.setAttribute("aria-label", "Move down");
      downBtn.textContent = "▼"; // ▼
      downBtn.addEventListener("click", function () {
        moveRow(li, 1);
      });

      li.appendChild(handle);
      li.appendChild(rankLabel);
      li.appendChild(upBtn);
      li.appendChild(downBtn);

      // HTML5 drag-and-drop event handlers (desktop)
      li.addEventListener("dragstart", function (e) {
        dragSrcRow = li;
        li.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      li.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        // Clear other drop-target highlights
        var rows = document.querySelectorAll(".rank-row");
        rows.forEach(function (r) { r.classList.remove("drop-target"); });
        if (li !== dragSrcRow) {
          li.classList.add("drop-target");
        }
      });

      li.addEventListener("drop", function (e) {
        e.preventDefault();
        if (dragSrcRow && li !== dragSrcRow) {
          var list = document.getElementById("rank-list");
          var rows = Array.from(list.children);
          var srcIdx = rows.indexOf(dragSrcRow);
          var tgtIdx = rows.indexOf(li);
          if (srcIdx < tgtIdx) {
            list.insertBefore(dragSrcRow, li.nextSibling);
          } else {
            list.insertBefore(dragSrcRow, li);
          }
          refreshArrowStates();
        }
        li.classList.remove("drop-target");
      });

      li.addEventListener("dragend", function () {
        li.classList.remove("dragging");
        var rows = document.querySelectorAll(".rank-row");
        rows.forEach(function (r) { r.classList.remove("drop-target"); });
        dragSrcRow = null;
      });

      return li;
    }

    function moveRow(li, direction) {
      var list = document.getElementById("rank-list");
      if (direction === -1) {
        // Move up: insert before previous sibling
        var prev = li.previousElementSibling;
        if (prev) {
          list.insertBefore(li, prev);
        }
      } else {
        // Move down: insert after next sibling
        var next = li.nextElementSibling;
        if (next) {
          list.insertBefore(li, next.nextSibling);
        }
      }
      refreshArrowStates();
    }

    function refreshArrowStates() {
      var rows = document.querySelectorAll(".rank-row");
      rows.forEach(function (row, idx) {
        var upBtn = row.querySelector(".up-btn");
        var downBtn = row.querySelector(".down-btn");
        if (upBtn) upBtn.disabled = (idx === 0);
        if (downBtn) downBtn.disabled = (idx === rows.length - 1);
      });
    }

    function setStatus(msg) {
      var el = document.getElementById("status");
      if (el) el.textContent = msg;
    }

    function handleSubmit() {
      // Step 1: disable all interaction synchronously before fetch to prevent double-submit
      var submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;

      var rows = document.querySelectorAll(".rank-row");
      rows.forEach(function (row) {
        row.setAttribute("draggable", "false");
        var upBtn = row.querySelector(".up-btn");
        var downBtn = row.querySelector(".down-btn");
        if (upBtn) upBtn.disabled = true;
        if (downBtn) downBtn.disabled = true;
      });

      setStatus("Submitting…");

      // Collect current DOM order into an array of label strings
      var order = [];
      rows.forEach(function (row) {
        var labelEl = row.querySelector(".rank-label");
        if (labelEl) order.push(labelEl.textContent);
      });

      var payload = {
        order: order,
        submitted_at: new Date().toISOString()
      };

      // POST to /submit (widget's own origin via relative path)
      var submitUrl = PANE_BASE + "/submit";

      fetch(submitUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function (res) {
        if (!res.ok && res.status !== 204) {
          throw new Error("submit returned " + res.status);
        }
        submitBtn.textContent = "Submitted.";
        setStatus("");

        // Step 2: fire postMessage AFTER fetch resolves OK
        // This guarantees state.json is written before the agent wakes.
        // Target window.location.origin explicitly — never "*".
        window.parent.postMessage(
          {
            type: "widget-submit",
            widgetId: WIDGET_ID,
            value: { order: order }
          },
          window.location.origin
        );
      })
      .catch(function (err) {
        // On fetch failure: log + do NOT fire postMessage.
        // The agent must not wake to a submit that didn't persist.
        console.error("[widget] submit fetch failed:", err);
        setStatus("Submission failed — please try again.");

        // Re-enable all interaction so the user can retry
        submitBtn.disabled = false;
        rows.forEach(function (row) {
          row.setAttribute("draggable", "true");
        });
        refreshArrowStates();
      });
    }
  
    // Phase 143: report content height to parent so WidgetBubble can
    // auto-size the iframe up to its cap and paint the scroll thumb
    // when overflowing. Widget-side does zero overflow UI.
    var __lastReportedHeight = 0;
    function reportHeight() {
      var h = Math.ceil(document.documentElement.scrollHeight);
      // Dedup: skip if measured height matches last post. The parent-side
      // iframe `transition: height 120ms ease-out` was the primary
      // ignition for a renderer-pinning resize-storm (removed from
      // WidgetBubble.tsx 2026-10-02 after a confirmed main-thread freeze).
      // Widget-side dedup is defense in depth so no-op postMessages
      // don't flood even if a future consumer re-adds any transition
      // on the iframe.
      if (h === __lastReportedHeight) return;
      __lastReportedHeight = h;
      try {
        window.parent.postMessage(
          { type: "widget-resize", widgetId: WIDGET_ID, height: h },
          window.location.origin
        );
      } catch (e) { /* parent gone; harmless */ }
    }
    document.addEventListener("DOMContentLoaded", function () {
      reportHeight();
      if (typeof ResizeObserver !== "undefined") {
        var ro = new ResizeObserver(reportHeight);
        ro.observe(document.documentElement);
      }
    });
  </script>
</body>
</html>
