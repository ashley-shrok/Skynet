<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills modal mock</title>
<style>
  :root {
    --hue: 220;
    --text: #fbf5e8;
    --muted: hsla(var(--hue), 22%, 88%, 0.62);
    --faint: hsla(var(--hue), 22%, 88%, 0.38);
    --line: hsla(var(--hue), 25%, 55%, 0.22);
    --line-strong: hsla(var(--hue), 25%, 60%, 0.38);
    --accent: hsl(36, 85%, 62%);
    --accent-bg: hsla(36, 80%, 55%, 0.16);
    --accent-line: hsla(36, 80%, 60%, 0.45);
    --agent: hsl(200, 70%, 66%);
    --agent-bg: hsla(200, 70%, 55%, 0.15);
    --user: hsl(290, 55%, 72%);
    --user-bg: hsla(290, 55%, 55%, 0.16);
    --both: hsl(150, 45%, 64%);
    --both-bg: hsla(150, 45%, 50%, 0.14);
    --danger: hsl(0, 70%, 66%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0d0f13;
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    overflow: hidden;
  }
  /* fake app behind */
  .app-bg { position: fixed; inset: 0; display: flex; }
  .app-bg .side { width: 260px; background: #14171d; border-right: 1px solid #222731; }
  .app-bg .main { flex: 1; background: radial-gradient(ellipse at 60% 30%, #1b2029, #0f1115); }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); }

  .modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(1080px, calc(100vw - 48px)); height: min(760px, 85vh);
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, hsl(220,14%,22%), hsl(220,18%,12%));
    border: 1px solid hsla(220,25%,55%,.30); border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 1px 0 rgba(255,220,190,.22) inset, 0 0 40px hsla(220,40%,55%,.12);
  }
  @media (max-width: 640px) {
    .modal { inset: 0; transform: none; left: 0; top: 0; width: 100vw; height: 100dvh; border-radius: 0; border: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }

  /* head */
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .head h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .head .crumb { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .head .crumb .back { background: none; border: 0; color: var(--muted); padding: 2px 4px; border-radius: 6px; font-size: 16px; font-weight: 600; }
  .head .crumb .back:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .head .crumb .sep { color: var(--faint); }
  .head .crumb .cur { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .spacer { flex: 1; }
  .icon-btn { background: none; border: 0; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
  .icon-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .btn { border-radius: 8px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--line-strong); background: rgba(255,255,255,.04); }
  .btn:hover { background: rgba(255,255,255,.08); }
  .btn.primary { background: var(--accent-bg); border-color: var(--accent-line); color: #ffe9c4; }
  .btn.primary:hover { background: hsla(36,80%,55%,.26); }
  .btn.primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn.danger { color: var(--danger); border-color: hsla(0,70%,60%,.35); background: transparent; }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---------- LIBRARY ---------- */
  .lib-tools { display: flex; gap: 10px; align-items: center; padding: 12px 18px; flex-wrap: wrap; flex-shrink: 0; }
  .search { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px;
    background: rgba(0,0,0,.25); border: 1px solid var(--line); }
  .search input { flex: 1; background: none; border: 0; outline: none; min-width: 0; }
  .search input::placeholder { color: var(--faint); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: rgba(0,0,0,.2); }
  .seg button { background: none; border: 0; padding: 6px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: rgba(255,255,255,.08); color: var(--text); }
  .host-pick { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .host-pick select { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .host-pick option { background: #1a1a1a; }

  .lib-scroll { flex: 1; overflow: auto; padding: 4px 18px 18px; }
  .group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 14px 2px 8px; display: flex; gap: 8px; align-items: center; }
  .group-h .n { background: rgba(255,255,255,.06); border-radius: 10px; padding: 0 7px; letter-spacing: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .card { text-align: left; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px 11px;
    display: flex; flex-direction: column; gap: 7px; transition: background .1s, border-color .1s; min-height: 108px; }
  .card:hover { background: rgba(255,255,255,.065); border-color: var(--line-strong); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; font-size: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .card .name::before { content: "/"; color: var(--faint); }
  .card .desc { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .desc.empty { font-style: italic; color: var(--faint); }
  .card .meta { margin-top: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
  .pill.both { color: var(--both); background: var(--both-bg); border-color: hsla(150,45%,55%,.3); }
  .pill.user { color: var(--user); background: var(--user-bg); border-color: hsla(290,55%,60%,.3); }
  .pill.agent { color: var(--agent); background: var(--agent-bg); border-color: hsla(200,70%,60%,.3); }
  .pill.everywhere { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-line); }
  .pill.files { color: var(--faint); border-color: var(--line); }
  .pill.warn { color: hsl(45,90%,65%); background: hsla(45,90%,50%,.12); border-color: hsla(45,90%,55%,.35); }
  .new-card { border-style: dashed; align-items: center; justify-content: center; color: var(--muted); flex-direction: row; gap: 8px; }
  .new-card:hover { color: var(--text); }
  .empty-state { text-align: center; color: var(--muted); padding: 50px 20px; }

  /* ---------- DETAIL ---------- */
  .detail { flex: 1; min-height: 0; display: flex; }
  .d-side { width: 260px; flex-shrink: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: rgba(0,0,0,.14); overflow: auto; }
  .d-sec { padding: 14px 14px 12px; border-bottom: 1px solid var(--line); }
  .d-sec:last-child { border-bottom: 0; }
  .d-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin-bottom: 8px; }
  .d-desc { width: 100%; resize: vertical; min-height: 64px; background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12.5px; outline: none; color: var(--text); }
  .d-desc:focus { border-color: var(--line-strong); }
  .hint { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .radio { display: flex; flex-direction: column; gap: 4px; }
  .radio label { display: flex; gap: 9px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .radio label:hover { background: rgba(255,255,255,.04); }
  .radio label.on { background: rgba(255,255,255,.06); border-color: var(--line); }
  .radio input { margin: 2px 0 0; accent-color: hsl(36,85%,62%); }
  .radio .t { font-size: 13px; }
  .radio .s { font-size: 11.5px; color: var(--faint); }
  .files { display: flex; flex-direction: column; gap: 1px; }
  .file { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; background: none; border: 0; text-align: left; font-size: 12.5px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .file:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .file.on { background: rgba(255,255,255,.09); color: var(--text); }
  .file .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: auto; }
  .add-file { margin-top: 6px; background: none; border: 1px dashed var(--line); border-radius: 7px; padding: 5px 8px; font-size: 12px; color: var(--faint); text-align: left; }
  .add-file:hover { color: var(--text); border-color: var(--line-strong); }
  .d-danger { margin-top: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .link-btn { background: none; border: 0; text-align: left; padding: 4px 0; font-size: 12.5px; color: var(--muted); }
  .link-btn:hover { color: var(--text); }
  .link-btn.danger { color: hsla(0,70%,66%,.8); }
  .link-btn.danger:hover { color: var(--danger); }

  .d-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ed-bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .ed-bar .fn { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  .ed-bar .unsaved { color: var(--accent); }
  .editor { flex: 1; min-height: 0; width: 100%; resize: none; border: 0; outline: none; background: rgba(0,0,0,.18);
    padding: 16px 18px; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e9e3d4; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .foot .status { font-size: 12px; color: var(--faint); }
  .banner { margin: 10px 14px 0; font-size: 12.5px; padding: 8px 11px; border-radius: 8px; background: var(--accent-bg); border: 1px solid var(--accent-line); color: #ffe2b0; }
  .banner.ro { background: rgba(255,255,255,.05); border-color: var(--line); color: var(--muted); }

  .mobile-tabs { display: none; }
  @media (max-width: 720px) {
    .detail { flex-direction: column; }
    .d-side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .detail.tab-files .d-side .about-only, .detail.tab-about .d-main { display: none; }
    .detail.tab-files .d-side { max-height: 30%; }
    .detail.tab-about .d-side { flex: 1; }
    .mobile-tabs { display: flex; padding: 8px 14px 0; gap: 6px; }
    .mobile-tabs button { flex: 1; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 13px; color: var(--muted); }
    .mobile-tabs button.on { color: var(--text); background: rgba(255,255,255,.1); }
    .d-danger { display: none; }
    .detail.tab-about .d-danger { display: flex; }
    .grid { grid-template-columns: 1fr; }
  }

  /* ---------- CREATE ---------- */
  .create { flex: 1; overflow: auto; padding: 22px 18px; }
  .create-inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .field label.l { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field .sub { font-size: 12px; color: var(--faint); margin-bottom: 8px; }
  .txt { width: 100%; background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; outline: none; }
  .txt:focus { border-color: var(--line-strong); }
  .slug { font-size: 12px; color: var(--faint); margin-top: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .slug b { color: var(--accent); font-weight: 500; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .opts.two { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 640px) { .opts, .opts.two { grid-template-columns: 1fr; } }
  .opt { text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; background: rgba(255,255,255,.03); }
  .opt:hover { background: rgba(255,255,255,.06); }
  .opt.on { border-color: var(--accent-line); background: var(--accent-bg); }
  .opt .t { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .opt .s { font-size: 12px; color: var(--muted); }

  .proto-bar { position: fixed; bottom: 10px; left: 10px; z-index: 100; font-size: 11px; color: #9aa3b2; background: rgba(0,0,0,.6);
    padding: 5px 9px; border-radius: 8px; border: 1px solid #2a2f3a; }
  .proto-bar button { background: #222833; border: 1px solid #333b48; color: #cfd6e2; border-radius: 6px; padding: 2px 7px; margin-left: 4px; font-size: 11px; }
  @media (max-width: 640px) { .proto-bar { display: none; } }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #262c37; border: 1px solid #3a4352; padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-bg"><div class="side"></div><div class="main"></div></div>
<div class="backdrop"></div>
<div class="modal" id="modal"></div>
<div class="proto-bar">Mock — <button id="multi">multi-host: on</button><button id="nonadmin">admin: yes</button></div>
<div class="toast" id="toast"></div>

<script>
const SKILLS = [
  { name: "agent-phone", desc: "Place a phone call to a user to deliver a message and get their spoken reply.", who: "both", scope: "everywhere", files: ["SKILL.md"] },
  { name: "agent-relay", desc: "Talk to other Claude Code agents over the fleet's Matrix relay — find a peer's account, open or join a room, send messages and files.", who: "both", scope: "everywhere", files: ["SKILL.md", "relay-cheatsheet.md"] },
  { name: "app-development", desc: "Builds a new app, or edits an existing one. Use when the user asks for an app, tool, tracker, dashboard, log, or webpage.", who: "both", scope: "everywhere", files: ["SKILL.md", "scaffold.md", "manifest.md", "systemd.md", "icons.md", "troubleshooting.md", "examples/tracker.md"] },
  { name: "archive-when-done", desc: "Archive when done", who: "user", scope: "host", files: ["SKILL.md"] },
  { name: "build", desc: "Deliver a feature or fix end-to-end, with the user in the loop.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "call-me", desc: "Call when finished with work", who: "user", scope: "host", files: ["SKILL.md"] },
  { name: "campaign", desc: "Run a multi-shape feature as a campaign — a whole-session concept-open followed by one /build per shape.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "close", desc: "Close a piece of work that was opened with /open. Verifies the built result matches the agreed shape, both ways.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "deploy", desc: "Deploys", who: "both", scope: "host", files: ["SKILL.md"], thin: true },
  { name: "explain", desc: "Describe X to the user without using code symbols, in a conceptual model style.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "gmail", desc: "Read, search, send, and organize Gmail messages.", who: "user", scope: "host", files: ["SKILL.md", "auth.md", "gmail.py"] },
  { name: "light-review", desc: "Unbiased sub-agent code review", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "open", desc: "Open a piece of work — issue, feature, or fix — by having the user pitch the shape, discussing it, then grilling it.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "pnd", desc: "Push, no deploy", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "pndtay", desc: "Push, no deploy, then archive yourself.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "promote-to-coordinator", desc: "Convert the currently loaded identity into a coordinator for its role.", who: "user", scope: "host", files: ["SKILL.md"] },
  { name: "queue", desc: "Add a task to your harness task list without interrupting what you are doing.", who: "both", scope: "host", files: ["SKILL.md"] },
  { name: "sensor-development", desc: "", who: "agent", scope: "everywhere", files: ["SKILL.md", "examples.md"] },
];
const HOSTS = ["t1000", "thenasty", "workstation", "robin-beelink"];

const S = {
  view: "library",   // library | detail | create
  q: "", filter: "all", host: "t1000",
  sel: null, file: "SKILL.md", mtab: "files",
  dirty: new Set(), multi: true, admin: true,
  create: { name: "", desc: "", who: "both", scope: "host" },
};

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }

const WHO = {
  both: { pill: "You & agents", cls: "both", t: "You and agents", s: "Agents use it when it fits; you can also type /name." },
  user: { pill: "Only you", cls: "user", t: "Only you", s: "Runs only when you type /name. Agents won't reach for it." },
  agent: { pill: "Only agents", cls: "agent", t: "Only agents", s: "Agents use it when it fits. Hidden from your Skills menu." },
};
const ICON = {
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  search: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.55"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  globe: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  file: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.6"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
};

function skillBody(s) {
  if (s.file !== "SKILL.md") return `# ${s.file}\n\nSupporting notes for /${s.sk.name}.\n`;
  const sk = s.sk;
  return `# ${sk.name}\n\n${sk.desc || "(describe what this skill does)"}\n\n## When to use\n\n- ...\n\n## Steps\n\n1. ...\n2. ...\n`;
}

function head(inner, right = "") {
  return `<div class="head">${inner}<div class="spacer"></div>${right}<button class="icon-btn" title="Close" onclick="toast('closes the modal')">${ICON.x}</button></div>`;
}

function renderLibrary() {
  const q = S.q.toLowerCase();
  const list = SKILLS.filter((s) =>
    (S.filter === "all" || s.who === S.filter) &&
    (!q || s.name.includes(q) || s.desc.toLowerCase().includes(q)));
  const ew = list.filter((s) => s.scope === "everywhere");
  const host = list.filter((s) => s.scope === "host");
  const card = (s) => `
    <button class="card" onclick="openSkill('${s.name}')">
      <div class="top"><span class="name">${esc(s.name)}</span></div>
      <div class="desc ${s.desc ? "" : "empty"}">${esc(s.desc || "No description — agents won't know when to use this")}</div>
      <div class="meta">
        <span class="pill ${WHO[s.who].cls}">${WHO[s.who].pill}</span>
        ${s.scope === "everywhere" ? `<span class="pill everywhere">${ICON.globe} Every host</span>` : ""}
        ${!s.desc || s.thin ? `<span class="pill warn">Needs a description</span>` : ""}
        <span class="pill files">${s.files.length} file${s.files.length > 1 ? "s" : ""}</span>
      </div>
    </button>`;
  const section = (title, arr, extra = "") =>
    arr.length ? `<div class="group-h">${title}<span class="n">${arr.length}</span></div><div class="grid">${arr.map(card).join("")}${extra}</div>` : "";
  const newCard = `<button class="card new-card" onclick="go('create')">${ICON.plus} New skill</button>`;

  $("#modal").innerHTML = `
    ${head(`<h1>Skills</h1>`, `<button class="btn primary" onclick="go('create')">${ICON.plus.replace('width="14"', 'width="12"')} New skill</button>`)}
    <div class="body">
      <div class="lib-tools">
        <div class="search">${ICON.search}<input id="q" placeholder="Search skills by name or what they do" value="${esc(S.q)}"></div>
        <div class="seg">
          ${["all", "both", "user", "agent"].map((f) => `<button class="${S.filter === f ? "on" : ""}" onclick="S.filter='${f}';render()">${f === "all" ? "All" : WHO[f].pill}</button>`).join("")}
        </div>
        ${S.multi ? `<div class="host-pick">Host <select onchange="S.host=this.value;render()">${HOSTS.map((h) => `<option ${h === S.host ? "selected" : ""}>${h}</option>`).join("")}</select></div>` : ""}
      </div>
      <div class="lib-scroll">
        ${list.length === 0 ? `<div class="empty-state">No skills match “${esc(S.q)}”.</div>` : ""}
        ${section(`${ICON.globe} On every host`, ew)}
        ${section(S.multi ? `Only on ${S.host}` : "On this host", host, newCard)}
      </div>
    </div>`;
  const qi = $("#q");
  qi.oninput = () => { S.q = qi.value; render(); const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

function renderDetail() {
  const sk = S.sel;
  const ro = sk.scope === "everywhere" && !S.admin;
  const dirtyHere = S.dirty.has(S.file);
  $("#modal").innerHTML = `
    ${head(`<div class="crumb"><button class="back" onclick="back()">Skills</button><span class="sep">/</span><span class="cur">${esc(sk.name)}</span>
       <span class="pill ${WHO[sk.who].cls}" style="margin-left:6px">${WHO[sk.who].pill}</span>
       ${sk.scope === "everywhere" ? `<span class="pill everywhere">${ICON.globe} Every host</span>` : ""}</div>`)}
    <div class="mobile-tabs">
      <button class="${S.mtab === "files" ? "on" : ""}" onclick="S.mtab='files';render()">Files</button>
      <button class="${S.mtab === "about" ? "on" : ""}" onclick="S.mtab='about';render()">Settings</button>
    </div>
    <div class="body"><div class="detail tab-${S.mtab}">
      <div class="d-side">
        <div class="d-sec about-only">
          <div class="d-label">What it does</div>
          <textarea class="d-desc" ${ro ? "disabled" : ""} oninput="markDirty('SKILL.md')">${esc(sk.desc)}</textarea>
          <div class="hint">Agents read this to decide when to use the skill.</div>
        </div>
        <div class="d-sec about-only">
          <div class="d-label">Who can use it</div>
          <div class="radio">
            ${["both", "user", "agent"].map((w) => `
              <label class="${sk.who === w ? "on" : ""}"><input type="radio" name="who" ${sk.who === w ? "checked" : ""} ${ro ? "disabled" : ""} onchange="setWho('${w}')">
                <div><div class="t">${WHO[w].t}</div><div class="s">${WHO[w].s.replace("/name", "/" + esc(sk.name))}</div></div></label>`).join("")}
          </div>
        </div>
        <div class="d-sec about-only">
          <div class="d-label">Where it lives</div>
          <div class="radio">
            <label class="${sk.scope === "host" ? "on" : ""}"><input type="radio" name="scope" ${sk.scope === "host" ? "checked" : ""} ${!S.admin ? "disabled" : ""} onchange="setScope('host')">
              <div><div class="t">Only ${S.multi ? S.host : "this host"}</div><div class="s">Agents on other hosts won't have it.</div></div></label>
            <label class="${sk.scope === "everywhere" ? "on" : ""}"><input type="radio" name="scope" ${sk.scope === "everywhere" ? "checked" : ""} ${!S.admin ? "disabled" : ""} onchange="setScope('everywhere')">
              <div><div class="t">Every host</div><div class="s">One copy, kept in step on all hosts.${S.admin ? "" : " Admins only."}</div></div></label>
          </div>
        </div>
        <div class="d-sec">
          <div class="d-label">Files</div>
          <div class="files">
            ${sk.files.map((f) => `<button class="file ${f === S.file ? "on" : ""}" onclick="S.file='${f}';S.mtab='files';render()">${ICON.file}${esc(f)}${S.dirty.has(f) ? '<span class="dot"></span>' : ""}</button>`).join("")}
            ${ro ? "" : `<button class="add-file" onclick="addFile()">+ Add file</button>`}
          </div>
        </div>
        <div class="d-danger about-only">
          <button class="link-btn" onclick="toast('copies /${sk.name} as a new skill')">Duplicate…</button>
          ${ro ? "" : `<button class="link-btn danger" onclick="toast('${sk.scope === "everywhere" ? "removes from every host (confirm first)" : "deletes the skill (confirm first)"}')">${sk.scope === "everywhere" ? "Remove from every host…" : "Delete skill…"}</button>`}
        </div>
      </div>
      <div class="d-main">
        ${ro ? `<div class="banner ro">Shared across every host — only an admin can change it.</div>` : ""}
        <div class="ed-bar"><span class="fn">${esc(S.file)}</span>${dirtyHere ? '<span class="unsaved">● unsaved</span>' : ""}<div class="spacer" style="flex:1"></div><span>Markdown</span></div>
        <textarea class="editor" ${ro ? "readonly" : ""} oninput="markDirty(S.file)">${esc(skillBody({ sk, file: S.file }))}</textarea>
        <div class="foot">
          <span class="status">${S.dirty.size ? `${S.dirty.size} unsaved file${S.dirty.size > 1 ? "s" : ""}` : "All changes saved"}</span>
          <div style="flex:1"></div>
          <button class="btn primary" ${S.dirty.size ? "" : "disabled"} onclick="save()">Save</button>
        </div>
      </div>
    </div></div>`;
}

function renderCreate() {
  const c = S.create;
  const slug = slugify(c.name);
  const taken = SKILLS.some((s) => s.name === slug);
  const ok = slug && !taken && c.desc.trim();
  $("#modal").innerHTML = `
    ${head(`<div class="crumb"><button class="back" onclick="back()">Skills</button><span class="sep">/</span><span class="cur">New skill</span></div>`)}
    <div class="body"><div class="create"><div class="create-inner">
      <div class="field">
        <label class="l">Name</label>
        <input class="txt" id="cn" placeholder="e.g. Weekly report" value="${esc(c.name)}">
        <div class="slug" id="slug">${slug ? (taken ? `<span style="color:var(--danger)">/${slug} already exists</span>` : `You'll invoke it as <b>/${slug}</b>`) : "&nbsp;"}</div>
      </div>
      <div class="field">
        <label class="l">What it does</label>
        <div class="sub">One or two sentences. Agents read this to decide when the skill applies.</div>
        <textarea class="txt" id="cd" rows="3" placeholder="e.g. Pull this week's merged PRs and write a short summary for the team channel.">${esc(c.desc)}</textarea>
      </div>
      <div class="field">
        <label class="l">Who can use it</label>
        <div class="opts">
          ${["both", "user", "agent"].map((w) => `<button class="opt ${c.who === w ? "on" : ""}" onclick="S.create.who='${w}';render()"><div class="t">${WHO[w].t}</div><div class="s">${WHO[w].s.replace("/name", slug ? "/" + slug : "its /command")}</div></button>`).join("")}
        </div>
      </div>
      <div class="field">
        <label class="l">Where it lives</label>
        <div class="opts two">
          <button class="opt ${c.scope === "host" ? "on" : ""}" onclick="S.create.scope='host';render()"><div class="t">Only ${S.multi ? S.host : "this host"}</div><div class="s">Just agents on this machine.</div></button>
          <button class="opt ${c.scope === "everywhere" ? "on" : ""}" ${S.admin ? "" : "disabled style='opacity:.45;cursor:not-allowed'"} onclick="S.create.scope='everywhere';render()"><div class="t">Every host</div><div class="s">${S.admin ? "Every agent, on every machine." : "Admins only."}</div></button>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="back()">Cancel</button>
        <button class="btn primary" ${ok ? "" : "disabled"} onclick="createSkill()">Create and edit steps</button>
      </div>
    </div></div></div>`;
  const keep = (id, key) => { const el = $("#" + id); el.oninput = () => { S.create[key] = el.value; const pos = el.selectionStart; render(); const n = $("#" + id); n.focus(); n.setSelectionRange(pos, pos); }; };
  keep("cn", "name"); keep("cd", "desc");
}

function render() {
  if (S.view === "library") renderLibrary();
  else if (S.view === "detail") renderDetail();
  else renderCreate();
}
function go(v) { S.view = v; if (v === "create") S.create = { name: "", desc: "", who: "both", scope: "host" }; render(); }
function back() {
  if (S.view === "detail" && S.dirty.size && !confirm("Discard unsaved changes?")) return;
  S.dirty.clear(); S.view = "library"; render();
}
function openSkill(n) { S.sel = SKILLS.find((s) => s.name === n); S.file = "SKILL.md"; S.mtab = "files"; S.dirty.clear(); S.view = "detail"; render(); }
function markDirty(f) { if (!S.dirty.has(f)) { S.dirty.add(f); const st = $(".foot .status"); if (st) render(); } }
function save() { S.dirty.clear(); render(); toast("Saved"); }
function setWho(w) { S.sel.who = w; render(); toast("Saved — " + WHO[w].pill.toLowerCase()); }
function setScope(sc) {
  if (sc === "everywhere" && !confirm(`Copy /${S.sel.name} to every host and keep it in step?`)) return render();
  if (sc === "host" && !confirm(`Stop sharing /${S.sel.name}? It stays on ${S.host} only.`)) return render();
  S.sel.scope = sc; render(); toast(sc === "everywhere" ? "Now on every host" : "Now only on " + S.host);
}
function addFile() { const n = prompt("File name", "notes.md"); if (n) { S.sel.files.push(n); S.file = n; render(); } }
function createSkill() {
  const c = S.create; const sk = { name: slugify(c.name), desc: c.desc.trim(), who: c.who, scope: c.scope, files: ["SKILL.md"] };
  SKILLS.push(sk); SKILLS.sort((a, b) => a.name.localeCompare(b.name)); openSkill(sk.name); toast("Created /" + sk.name);
}

$("#multi").onclick = (e) => { S.multi = !S.multi; e.target.textContent = "multi-host: " + (S.multi ? "on" : "off"); render(); };
$("#nonadmin").onclick = (e) => { S.admin = !S.admin; e.target.textContent = "admin: " + (S.admin ? "yes" : "no"); render(); };
render();
</script>
</body>
</html>
