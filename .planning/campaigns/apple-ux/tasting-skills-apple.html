<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills modal mock</title>
<style>
  :root {
    --bg: #1c1c1e;
    --sidebar: #232325;
    --group: #2c2c2e;
    --group-hover: #333336;
    --sep: rgba(84, 84, 88, 0.55);
    --label: rgba(255, 255, 255, 0.92);
    --label2: rgba(235, 235, 245, 0.6);
    --label3: rgba(235, 235, 245, 0.3);
    --accent: #0a84ff;
    --red: #ff453a;
    --sel: rgba(10, 132, 255, 0.85);
    --fill: rgba(118, 118, 128, 0.24);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b0b0c; color: var(--label); overflow: hidden;
    font: 13px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); }
  .modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(920px, calc(100vw - 48px)); height: min(620px, 85vh);
    display: flex; background: var(--bg); border-radius: 12px; overflow: hidden;
    border: 0.5px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 0.5px rgba(0,0,0,.8);
  }

  /* ---------- sidebar (source list) ---------- */
  .side { width: 230px; flex-shrink: 0; background: var(--sidebar); border-right: 0.5px solid var(--sep); display: flex; flex-direction: column; }
  .side-top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .side-title { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .side-title h1 { margin: 0; font-size: 13px; font-weight: 600; color: var(--label2); }
  .plus { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--label2); }
  .plus:hover { background: var(--fill); color: var(--label); }
  .search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 7px; padding: 4px 8px; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; }
  .search input::placeholder { color: var(--label3); }
  .side-list { flex: 1; overflow: auto; padding: 0 10px 12px; }
  .sec-h { font-size: 11px; font-weight: 600; color: var(--label3); padding: 12px 8px 4px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--label); }
  .item:hover { background: rgba(255,255,255,.05); }
  .item.on { background: var(--sel); color: #fff; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .glyph { width: 16px; text-align: center; color: var(--label3); font-size: 12px; }
  .item.on .glyph { color: rgba(255,255,255,.8); }
  .host { margin: 0 12px 12px; display: flex; align-items: center; gap: 6px; color: var(--label2); font-size: 12px; padding: 6px 8px; border-radius: 7px; }
  .host:hover { background: var(--fill); }

  /* ---------- main pane ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .toolbar { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .toolbar .grow { flex: 1; }
  .tb-btn { color: var(--accent); font-size: 13px; padding: 4px 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 2px; }
  .tb-btn:hover { background: var(--fill); }
  .tb-btn:disabled { color: var(--label3); cursor: default; background: none; }
  .tb-btn.strong { font-weight: 600; }
  .tb-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 13px; pointer-events: none; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .close { width: 24px; height: 24px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--label2); }
  .close:hover { color: var(--label); }
  .scroll { flex: 1; overflow: auto; padding: 4px 32px 32px; }
  .wrap { max-width: 560px; margin: 0 auto; }

  .hero { padding: 6px 0 22px; }
  .hero h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .hero .cmd { color: var(--label2); font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .group-label { font-size: 11px; color: var(--label2); text-transform: uppercase; letter-spacing: .02em; padding: 0 14px 6px; }
  .group { background: var(--group); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .group-foot { font-size: 11.5px; color: var(--label2); padding: 0 14px; margin-bottom: 24px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 14px; width: 100%; text-align: left; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--sep); }
  button.row:hover { background: var(--group-hover); }
  .row .k { flex: 1; }
  .row .v { color: var(--label2); display: flex; align-items: center; gap: 4px; }
  .row .chev { color: var(--label3); font-size: 15px; margin-left: 2px; }
  .row.danger { color: var(--red); justify-content: center; }
  .row.danger .k { flex: none; }
  .row .file-ic { color: var(--label3); width: 16px; display: grid; place-items: center; }
  .row .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .row.add { color: var(--accent); }
  .desc-field { width: 100%; resize: none; border: 0; outline: none; background: none; padding: 11px 14px; line-height: 1.45; min-height: 64px; display: block; }
  .desc-field::placeholder { color: var(--label3); }

  /* popup menu */
  .menu { position: fixed; z-index: 50; min-width: 240px; background: rgba(40,40,42,.96); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 0.5px solid rgba(255,255,255,.12); border-radius: 9px; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .menu button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 5px 8px 5px 6px; border-radius: 5px; }
  .menu button:hover { background: var(--accent); }
  .menu button:hover .ms { color: rgba(255,255,255,.75); }
  .menu .ck { width: 14px; flex-shrink: 0; }
  .menu .ms { font-size: 11.5px; color: var(--label2); }
  .menu-catch { position: fixed; inset: 0; z-index: 49; }

  /* editor */
  .editor { flex: 1; width: 100%; resize: none; border: 0; outline: none; background: none; padding: 4px 32px 32px;
    font: 13px/1.65 ui-monospace, "SF Mono", Menlo, monospace; color: var(--label); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--label2); display: inline-block; }

  .empty { flex: 1; display: grid; place-items: center; color: var(--label3); font-size: 15px; }

  /* sheet */
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 30; display: grid; place-items: start center; padding-top: 0; }
  .sheet { width: min(440px, 92%); background: var(--bg); border: 0.5px solid rgba(255,255,255,.12); border-top: 0; border-radius: 0 0 12px 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.55); padding: 20px 20px 16px; animation: drop .18s ease-out; }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
  .sheet h3 { margin: 0 0 16px; font-size: 15px; font-weight: 600; text-align: center; }
  .sheet .group { margin-bottom: 6px; }
  .sheet input.row, .sheet textarea.row { background: none; border: 0; outline: none; }
  .sheet .row input { flex: 1; background: none; border: 0; outline: none; text-align: right; }
  .sheet .hint { font-size: 11.5px; color: var(--label2); padding: 0 14px; margin-bottom: 16px; min-height: 16px; }
  .sheet .hint.bad { color: var(--red); }
  .sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .pbtn { padding: 5px 14px; border-radius: 6px; background: var(--fill); }
  .pbtn.primary { background: var(--accent); color: #fff; }
  .pbtn:disabled { opacity: .4; cursor: default; }

  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: rgba(50,50,52,.95); padding: 7px 14px; border-radius: 20px; font-size: 12.5px; z-index: 200; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* ---------- phone: navigation stack ---------- */
  .back-ph, .done-ph { display: none !important; }
  @media (max-width: 680px) {
    body { font-size: 15px; }
    .modal { inset: 0; left: 0; top: 0; transform: none; width: 100vw; height: 100dvh; border-radius: 0; border: 0;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); background: #000; }
    .side { width: 100%; border: 0; background: #000; }
    .modal.at-detail .side, .modal.at-list .main { display: none; }
    .side-title h1 { font-size: 30px; font-weight: 700; color: var(--label); }
    .side-top { padding: 12px 16px 8px; }
    .plus { color: var(--accent); width: 32px; height: 32px; }
    .side-list { padding: 0 16px 16px; }
    .side-list .grp { background: #1c1c1e; border-radius: 10px; overflow: hidden; }
    .item { border-radius: 0; padding: 11px 14px; position: relative; }
    .item + .item::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--sep); }
    .item.on { background: none; color: var(--label); }
    .item::after { content: "›"; color: var(--label3); font-size: 18px; }
    .sec-h { padding: 18px 14px 6px; text-transform: uppercase; font-weight: 400; font-size: 12px; color: var(--label2); }
    .main { background: #000; }
    .scroll { padding: 4px 16px 32px; }
    .group { background: #1c1c1e; }
    .back-ph, .done-ph { display: inline-flex !important; }
    .editor { padding: 4px 16px 32px; font-size: 14px; }
    .close.ph-hide { display: none; }
  }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
const SKILLS = [
  { name: "agent-phone", desc: "Place a phone call to a user to deliver a message and get their spoken reply.", who: "both", everywhere: true, files: ["SKILL.md"] },
  { name: "agent-relay", desc: "Talk to other agents over the fleet's relay — find a peer, open a room, send messages and files.", who: "both", everywhere: true, files: ["SKILL.md", "cheatsheet.md"] },
  { name: "app-development", desc: "Builds a new app, or edits an existing one.", who: "both", everywhere: true, files: ["SKILL.md", "scaffold.md", "manifest.md", "systemd.md", "icons.md", "troubleshooting.md"] },
  { name: "sensor-development", desc: "", who: "agent", everywhere: true, files: ["SKILL.md", "examples.md"] },
  { name: "archive-when-done", desc: "Archive when done", who: "user", files: ["SKILL.md"] },
  { name: "build", desc: "Deliver a feature or fix end-to-end, with the user in the loop.", who: "both", files: ["SKILL.md"] },
  { name: "call-me", desc: "Call when finished with work", who: "user", files: ["SKILL.md"] },
  { name: "campaign", desc: "Run a multi-shape feature as a campaign.", who: "both", files: ["SKILL.md"] },
  { name: "close", desc: "Close a piece of work that was opened with /open.", who: "both", files: ["SKILL.md"] },
  { name: "deploy", desc: "Deploys", who: "both", files: ["SKILL.md"] },
  { name: "explain", desc: "Describe X to the user without code symbols, in a conceptual model style.", who: "both", files: ["SKILL.md"] },
  { name: "gmail", desc: "Read, search, send, and organize Gmail messages.", who: "user", files: ["SKILL.md", "auth.md", "gmail.py"] },
  { name: "light-review", desc: "Unbiased sub-agent code review", who: "both", files: ["SKILL.md"] },
  { name: "open", desc: "Open a piece of work by having the user pitch the shape, then discussing and grilling it.", who: "both", files: ["SKILL.md"] },
  { name: "pnd", desc: "Push, no deploy", who: "both", files: ["SKILL.md"] },
  { name: "queue", desc: "Add a task to your list without interrupting what you're doing.", who: "both", files: ["SKILL.md"] },
];
const WHO = {
  both: { t: "You and agents", s: "Agents use it when it fits. You can type /name." },
  user: { t: "Only you", s: "Runs only when you type /name." },
  agent: { t: "Only agents", s: "Hidden from your Skills menu." },
};
const HOST = "t1000";
const S = { sel: "build", page: "skill", file: null, q: "", dirty: false, phone: "list", menu: null, sheet: null };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const cur = () => SKILLS.find((s) => s.name === S.sel);
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }

const I = {
  search: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--label3)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  globe: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  doc: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  updown: '<svg width="9" height="12" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5l3-3 3 3M2 9l3 3 3-3"/></svg>',
};

function sidebar() {
  const q = S.q.toLowerCase();
  const match = SKILLS.filter((s) => !q || s.name.includes(q) || s.desc.toLowerCase().includes(q));
  const item = (s) => `<button class="item ${s.name === S.sel ? "on" : ""}" onclick="pick('${s.name}')"><span class="nm">${esc(s.name)}</span></button>`;
  const ew = match.filter((s) => s.everywhere), here = match.filter((s) => !s.everywhere);
  return `
    <div class="side">
      <div class="side-top">
        <div class="side-title"><h1>Skills</h1><span style="display:flex;gap:4px;align-items:center"><button class="plus" title="New skill" onclick="openSheet()">${I.plus}</button><button class="tb-btn strong done-ph" onclick="toast('closes')">Done</button></span></div>
        <div class="search">${I.search}<input id="q" placeholder="Search" value="${esc(S.q)}"></div>
      </div>
      <div class="side-list">
        ${here.length ? `<div class="sec-h">On ${HOST}</div><div class="grp">${here.map(item).join("")}</div>` : ""}
        ${ew.length ? `<div class="sec-h">On every host</div><div class="grp">${ew.map(item).join("")}</div>` : ""}
        ${!match.length ? `<div class="sec-h" style="text-transform:none">No results</div>` : ""}
      </div>
    </div>`;
}

function skillPage(sk) {
  return `
    <div class="toolbar">
      <button class="tb-btn back-ph" onclick="S.phone='list';render()">‹ Skills</button>
      <div class="grow"></div>
      <button class="close ph-hide" title="Close" onclick="toast('closes')">${I.x}</button>
    </div>
    <div class="scroll"><div class="wrap">
      <div class="hero"><h2>${esc(sk.name)}</h2><div class="cmd">/${esc(sk.name)}</div></div>

      <div class="group-label">Description</div>
      <div class="group"><textarea class="desc-field" rows="2" placeholder="What does this skill do, and when should an agent use it?">${esc(sk.desc)}</textarea></div>
      <div class="group-foot">Agents read this to decide when the skill applies.</div>

      <div class="group">
        <button class="row" onclick="openMenu(event)"><span class="k">Who can use it</span><span class="v">${WHO[sk.who].t} ${I.updown}</span></button>
        <button class="row" onclick="toggleEverywhere()"><span class="k">Available on</span><span class="v">${sk.everywhere ? "Every host" : HOST} ${I.updown}</span></button>
      </div>
      <div class="group-foot">${WHO[sk.who].s.replace("/name", "/" + esc(sk.name))}</div>

      <div class="group-label">Files</div>
      <div class="group">
        ${sk.files.map((f) => `<button class="row" onclick="openFile('${f}')"><span class="file-ic">${I.doc}</span><span class="k mono">${esc(f)}</span><span class="chev">›</span></button>`).join("")}
        <button class="row add" onclick="addFile()"><span class="file-ic">${I.plus}</span><span class="k">Add File…</span></button>
      </div>
      <div style="height:16px"></div>

      <div class="group"><button class="row danger" onclick="toast('confirm, then delete')"><span class="k">${sk.everywhere ? "Remove From Every Host…" : "Delete Skill…"}</span></button></div>
    </div></div>`;
}

function filePage(sk) {
  const body = S.file === "SKILL.md"
    ? `---\nname: ${sk.name}\ndescription: ${sk.desc}\n---\n\n# ${sk.name}\n\n## When to use\n\n…\n\n## Steps\n\n1. …\n2. …\n`
    : `# ${S.file}\n\nSupporting notes for /${sk.name}.\n`;
  return `
    <div class="toolbar">
      <button class="tb-btn" onclick="leaveFile()">‹ ${esc(sk.name)}</button>
      <div class="tb-title">${esc(S.file)} ${S.dirty ? '<span class="dot"></span>' : ""}</div>
      <div class="grow"></div>
      <button class="tb-btn strong" ${S.dirty ? "" : "disabled"} onclick="S.dirty=false;render();toast('Saved')">Save</button>
    </div>
    <textarea class="editor" spellcheck="false" oninput="if(!S.dirty){S.dirty=true;render();const e=$('.editor');e.focus();}">${esc(body)}</textarea>`;
}

function sheet() {
  if (!S.sheet) return "";
  const c = S.sheet, slug = slugify(c.name), taken = SKILLS.some((s) => s.name === slug);
  return `
    <div class="sheet-bg"><div class="sheet">
      <h3>New Skill</h3>
      <div class="group">
        <div class="row"><span class="k">Name</span><input id="sn" placeholder="Weekly report" value="${esc(c.name)}"></div>
      </div>
      <div class="hint ${taken ? "bad" : ""}">${slug ? (taken ? `/${slug} already exists` : `You'll run it with /${slug}`) : ""}</div>
      <div class="group"><textarea id="sd" class="desc-field" rows="3" placeholder="What it does, and when to use it">${esc(c.desc)}</textarea></div>
      <div class="hint">You can change who can use it once it's made.</div>
      <div class="sheet-actions">
        <button class="pbtn" onclick="S.sheet=null;render()">Cancel</button>
        <button class="pbtn primary" ${slug && !taken ? "" : "disabled"} onclick="create()">Create</button>
      </div>
    </div></div>`;
}

function menu() {
  if (!S.menu) return "";
  const sk = cur();
  return `<div class="menu-catch" onclick="S.menu=null;render()"></div>
    <div class="menu" style="left:${S.menu.x}px;top:${S.menu.y}px">
      ${["both", "user", "agent"].map((w) => `<button onclick="setWho('${w}')"><span class="ck">${sk.who === w ? "✓" : ""}</span><span><div>${WHO[w].t}</div><div class="ms">${WHO[w].s.replace("/name", "/" + sk.name)}</div></span></button>`).join("")}
    </div>`;
}

function render() {
  const sk = cur();
  const main = !sk ? `<div class="empty">No Skill Selected</div>` : S.page === "file" ? filePage(sk) : skillPage(sk);
  $("#modal").className = "modal " + (S.phone === "list" ? "at-list" : "at-detail");
  $("#modal").innerHTML = sidebar() + `<div class="main">${main}${sheet()}</div>` + menu();
  const q = $("#q");
  q.oninput = () => { S.q = q.value; render(); const n = $("#q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  const d = $(".desc-field:not(#sd)");
  if (d) d.oninput = () => { cur().desc = d.value; };
  for (const [id, key] of [["sn", "name"], ["sd", "desc"]]) {
    const el = $("#" + id); if (!el) continue;
    el.oninput = () => { S.sheet[key] = el.value; const p = el.selectionStart; render(); const n = $("#" + id); n.focus(); n.setSelectionRange(p, p); };
  }
}
function pick(n) { if (S.dirty && !confirm("Discard unsaved changes?")) return; S.dirty = false; S.sel = n; S.page = "skill"; S.phone = "detail"; render(); }
function openFile(f) { S.file = f; S.page = "file"; render(); }
function leaveFile() { if (S.dirty && !confirm("Discard unsaved changes?")) return; S.dirty = false; S.page = "skill"; render(); }
function openMenu(e) { const r = e.currentTarget.getBoundingClientRect(); S.menu = { x: Math.max(8, Math.min(r.right - 250, innerWidth - 258)), y: r.bottom + 4 }; render(); }
function setWho(w) { cur().who = w; S.menu = null; render(); }
function toggleEverywhere() {
  const sk = cur();
  const msg = sk.everywhere ? `Keep /${sk.name} on ${HOST} only? It will be removed from other hosts.` : `Copy /${sk.name} to every host and keep it in step?`;
  if (confirm(msg)) { sk.everywhere = !sk.everywhere; render(); }
}
function addFile() { const n = prompt("File name", "notes.md"); if (n) { cur().files.push(n); openFile(n); } }
function openSheet() { S.sheet = { name: "", desc: "" }; S.phone = "detail"; render(); setTimeout(() => $("#sn")?.focus(), 0); }
function create() {
  const c = S.sheet, sk = { name: slugify(c.name), desc: c.desc.trim(), who: "both", files: ["SKILL.md"] };
  SKILLS.push(sk); SKILLS.sort((a, b) => a.name.localeCompare(b.name));
  S.sheet = null; S.sel = sk.name; S.page = "skill"; render();
}
addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.menu || S.sheet)) { S.menu = null; S.sheet = null; render(); } });
if (innerWidth > 680) S.phone = "detail";
render();
</script>
